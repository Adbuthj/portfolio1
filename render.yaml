services:
  - type: web
    name: portfolio
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn portfolio_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DJANGO_SETTINGS_MODULE
        value: portfolio_project.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '*' 
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio_db
          property: connectionString

databases:
  - name: portfolio_db
    plan: free
