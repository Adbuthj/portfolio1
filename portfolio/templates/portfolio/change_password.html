{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | {{ about.full_name|default:"Portfolio" }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .form-group ul {
            list-style: none;
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="grain"></div>
    
    <div class="container" style="max-width: 500px;">
        <div class="glass reveal visible" style="padding: 3rem;">
            <div class="logo" style="margin-bottom: 2rem; font-size: 1.5rem; text-align: center;">CHANGE PASSWORD</div>
            
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                    <small style="display: block; color: var(--text-secondary); font-size: 0.75rem; margin-top: 0.25rem;">{{ field.help_text }}</small>
                    {% endif %}
                    {% if field.errors %}
                    {{ field.errors }}
                    {% endif %}
                </div>
                {% endfor %}
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; border: none; cursor: pointer;">
                    Update Password
                </button>
            </form>
            
            <div style="margin-top: 2rem; text-align: center;">
                <a href="{% url 'dashboard' %}" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
