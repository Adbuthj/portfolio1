{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | {{ about.full_name|default:"Portfolio" }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="grain"></div>
    <div class="container" style="max-width: 500px;">
        <div class="glass reveal visible" style="padding: 3rem; text-align: center;">
            <div class="logo" style="margin-bottom: 1.5rem; font-size: 1.5rem; color: #10b981;">SUCCESS!</div>
            <p style="color: var(--text-primary); margin-bottom: 2rem;">
                Your password has been set. You may now log in with your new password.
            </p>
            <a href="{% url 'login' %}" class="btn" style="text-decoration: none; width: 100%;">Log In Now</a>
        </div>
    </div>
</body>
</html>
