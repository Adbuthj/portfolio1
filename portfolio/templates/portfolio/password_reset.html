{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | {{ about.full_name|default:"Portfolio" }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="grain"></div>
    <div class="container" style="max-width: 500px;">
        <div class="glass reveal visible" style="padding: 3rem;">
            <div class="logo" style="margin-bottom: 1.5rem; font-size: 1.5rem; text-align: center;">RESET PASSWORD</div>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem;">
                Enter your Gmail address below, and we'll send you instructions to reset your password.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="your-email@gmail.com" required autofocus>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; border: none; cursor: pointer;">
                    Send Reset Link
                </button>
            </form>
            <div style="margin-top: 2rem; text-align: center;">
                <a href="{% url 'login' %}" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
