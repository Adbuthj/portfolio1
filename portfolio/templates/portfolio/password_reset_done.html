{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | {{ about.full_name|default:"Portfolio" }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="grain"></div>
    <div class="container" style="max-width: 500px;">
        <div class="glass reveal visible" style="padding: 3rem; text-align: center;">
            <div class="logo" style="margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--accent-color);">EMAIL SENT</div>
            <p style="color: var(--text-primary); margin-bottom: 1rem;">
                Check your Gmail inbox.
            </p>
            <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6;">
                We've emailed you instructions for setting your password. If you don't receive it, please check your spam folder.
            </p>
            <div style="margin-top: 2rem;">
                <a href="{% url 'login' %}" class="btn" style="text-decoration: none;">Return to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
